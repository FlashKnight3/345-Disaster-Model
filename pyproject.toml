[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "disaster-model"
version = "0.1.0"
description = "COMP 345 project on building damage and conflicting text"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
demo = ["Pillow>=10", "torch>=2.14", "torchvision>=0.29.1", "transformers>=4.57", "accelerate>=1"]

[tool.setuptools.packages.find]
where = ["src"]
